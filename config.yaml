# Configuración base compartida del Agent Harness (versionada en Git).
# IMPORTANTE: NO edites aquí rutas locales de tu máquina ni tu IA personal.
# Copia 'config.local.yaml.example' a 'config.local.yaml' (ignorado por Git) para tu entorno personal,
# o crea '<project_root>/.harness/config.yaml' para ajustes específicos de un proyecto.

project_name: "default-project"
# Ruta al repositorio destino (relativa al harness o absoluta). Sobrescribir en config.local.yaml.
project_root: "."

state:
  # Dónde guardar el estado compartido por el equipo:
  # - "harness": dentro de <harness_root>/.state y <harness_root>/reviews (versionado en este repo)
  # - "project": dentro de <project_root>/.harness/ (viaja con el Git del proyecto destino)
  location: "harness"

adapter:
  # Proveedores soportados: "antigravity" | "claude" | "codex" | "gemini" | "aider" | "custom_cli" | "manual"
  provider: "antigravity"
  # Modo de ejecución:
  # - "cli": exige que el binario exista en PATH; si falta, frena con error claro (nunca da falso positivo).
  # - "manual": genera .state/active_context.md y frena para que uses tu IDE/IA (Zed ACP, Cursor, Windsurf, Copilot, etc.)
  #             y luego valides con `python main.py <comando> --validate`.
  mode: "cli"
  binary: "agy"
  # Por defecto se envía el contexto por stdin para no depender de flags propietarios no confirmados.
  # Si tu CLI usa argumentos específicos, configúralos en config.local.yaml.
  args_template: []
  use_stdin: true
  timeout_seconds: 900

testing:
  # Comandos ejecutados dentro de project_root con shell=False y resolución multiplataforma (.cmd/.exe en Windows)
  unit_test_cmd: "npm test -- --watchAll=false"
  regression_test_cmd: "npm run test:ci"
  timeout_seconds: 300
  # Escaneo estático de seguridad sobre el código generado antes de correr tests en tu máquina
  pre_test_security_scan: true
  # Variables de entorno adicionales que se permite pasar al runner de tests (las credenciales se filtran por defecto)
  passthrough_env_vars: []

limits:
  max_module_retries: 3
  # Solo exige limpios los archivos dentro de allowed_paths del módulo activo (permite trabajar en paralelo en el resto del repo)
  require_clean_git_before_build: false
  require_clean_allowed_paths: true
  # Bloquea si el agente intenta hacer 'git commit' por su cuenta durante la Fase 3
  block_agent_commits: true
  # Protege tests preexistentes contra borrado, .skip() o reducción de aserciones
  protect_existing_tests: true
  # Exige que los documentos en inbox/ tengan IDs formales (RF-*, BR-*, etc.); si es false, usa anclas de sección con advertencia explícita
  require_formal_ids: true
  # Exige en Fase 4 que los archivos de código/test citados contengan referencia trazable a los IDs o módulos
  strict_code_traceability: false
  allowed_doc_extensions: [".md", ".txt", ".sql", ".json", ".yaml", ".yml"]

